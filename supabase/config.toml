# Backfill é iniciado por um administrador e valida JWT, organização, país e
# can_manage_settings dentro da própria função.
[functions.registry-backfill]
verify_jwt = false

[functions.integration-worker]
# Autenticação server-to-server própria via x-worker-token.
verify_jwt = false

# Evolution API (Fase 3 — Backend aditivo, INERTE em produção).
# Webhook publico chamado pelo servidor Evolution (Vultr). Auth em codigo
# via token compartilhado (EVOLUTION_GLOBAL_API_KEY) no header apikey/
# x-evolution-token/querystring token. Feature flag evolution_api_enabled
# bloqueia qualquer processamento enquanto desligada.
[functions.evolution-webhook]
verify_jwt = false

# Migração explícita de thread para outro endpoint (hoje: Evolution API)
# junto com o primeiro envio livre. verify_jwt=false porque validamos o JWT
# em código (getUser + user_organizations) para dar mensagens de erro claras.
[functions.thread-migrate-endpoint-send]
verify_jwt = false

# Snapshot read-only de saúde operacional consumido pelo Kairos Tech.
# Auth própria em código via header x-health-token (SERVICE_HEALTH_TOKEN).
[functions.service-health]
verify_jwt = false

# Histórico operacional read-only por serviço (Kairos Tech).
# Mesma auth própria em código via header x-health-token.
[functions.service-events]
verify_jwt = false

